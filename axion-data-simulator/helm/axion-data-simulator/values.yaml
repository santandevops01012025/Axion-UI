replicaCount: 1

image:
  repository: ghcr.io/devopsinsiders/axion-data-simulator
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# In-cluster URL of the ingestion service the simulator posts to.
apiUrl: http://axion-ingestion-service:8000/api/v1/telemetry/ingest
intervalSeconds: "5"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

podAnnotations: {}
imagePullSecrets: []
nodeSelector: {}
tolerations: []
affinity: {}