name: CI/CD - Build, Scan & Push to GHCR

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # 1) CODE QUALITY gate (SonarQube) BEFORE any image is built.
  code-quality:
    name: SonarQube scan + quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@v1.2
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Optional commercial SCA (uncomment if licences available):
      # - name: Checkmarx One
      #   uses: checkmarx/ast-github-action@main
      #   with:
      #     base_uri: ${{ secrets.CHECKMARX_BASE_URI }}
      #     cx_tenant: ${{ secrets.CHECKMARX_TENANT }}
      #     cx_client_id: ${{ secrets.CHECKMARX_CLIENT_ID }}
      #     cx_client_secret: ${{ secrets.CHECKMARX_CLIENT_SECRET }}
      #     project_name: axion-telemetry-query-service
      # - name: Black Duck
      #   uses: blackducksoftware/github-action@v3
      #   with:
      #     blackduck_url: ${{ secrets.BLACKDUCK_URL }}
      #     blackduck_token: ${{ secrets.BLACKDUCK_TOKEN }}

  # 2) BUILD -> IMAGE CVE SCAN (Trivy, fail on HIGH/CRITICAL) -> PUSH to GHCR.
  build-scan-push:
    name: Build -> Trivy -> Push (GHCR)
    runs-on: ubuntu-latest
    needs: code-quality
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build image (local, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # Optional Prisma Cloud image scan (uncomment if licensed):
      # - name: Prisma Cloud twistcli scan
      #   env:
      #     PRISMA_API_URL: ${{ secrets.PRISMA_API_URL }}
      #     PRISMA_USERNAME: ${{ secrets.PRISMA_USERNAME }}
      #     PRISMA_PASSWORD: ${{ secrets.PRISMA_PASSWORD }}
      #   run: |
      #     curl -LOk https://downloads.paloaltonetworks.com/twistcli
      #     chmod +x twistcli
      #     ./twistcli images scan --details --address $PRISMA_API_URL -u $PRISMA_USERNAME -p $PRISMA_PASSWORD docker.io/$IMAGE

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max