apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: axion-data-simulator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: axion
  source:
    repoURL: https://github.com/santandevops01012025/Axion-UI.git
    path: axion-data-simulator/helm/axion-data-simulator
    targetRevision: main
    helm:
      parameters:
        - name: image.repository
          value: ghcr.io/devopsinsiders/axion-data-simulator
  destination:
    server: https://kubernetes.default.svc
    namespace: axion
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true