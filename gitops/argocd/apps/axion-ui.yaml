apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: axion-ui
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: axion
  source:
    repoURL: https://github.com/santandevops01012025/Axion-UI.git
    path: axion-ui/helm/axion-ui
    targetRevision: main
    helm:
      parameters:
        - name: image.repository
          value: ghcr.io/devopsinsiders/axion-ui
  destination:
    server: https://kubernetes.default.svc
    namespace: axion
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true