# Credentials consumed by the Postgres container itself
apiVersion: v1
kind: Secret
metadata:
  name: axion-db-secret
  namespace: axion
  labels:
    app.kubernetes.io/name: axion-postgres
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password }}
  POSTGRES_DB: {{ .Values.postgres.database }}
---
# Derived DSN shared by every Axion microservice (password is URL-encoded)
apiVersion: v1
kind: Secret
metadata:
  name: axion-db-credentials
  namespace: axion
  labels:
    app.kubernetes.io/name: axion-postgres
type: Opaque
stringData:
  DATABASE_URL: postgresql://{{ .Values.postgres.user }}:P%40ssw01rd%40123@{{ .Values.service.name }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}