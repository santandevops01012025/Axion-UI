apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-ingestion-service
  namespace: axion
  labels:
    app: axion-ingestion-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: axion-ingestion-service
  template:
    metadata:
      labels:
        app: axion-ingestion-service
    spec:
      containers:
        - name: axion-ingestion-service
          image: ghcr.io/santandevops01012025/axion-ingestion-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: axion-db-credentials
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi