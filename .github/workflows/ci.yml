name: CI/CD - Axion

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# One matrix run over all five Axion services, two phases:
#   1. code-quality    : SonarQube scan + quality gate (blocks build on red gate)
#   2. build-scan-push : multi-stage build -> Trivy scan -> push to GHCR
#
# Images land in:  ghcr.io/santandevops01012025/<service>

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/santandevops01012025

jobs:
  code-quality:
    name: SonarQube - ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: axion-ui
            context: axion-ui
          - app: axion-telemetry-query-service
            context: axion-telemetry-query-service
          - app: axion-ingestion-service
            context: axion-ingestion-service
          - app: axion-data-simulator
            context: axion-data-simulator
          - app: axion-database-schema
            context: axion-database-schema
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        if: vars.ENABLE_SONARQUBE == 'true'
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: ${{ matrix.context }}
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Quality Gate check
        if: vars.ENABLE_SONARQUBE == 'true'
        uses: SonarSource/sonarqube-quality-gate-action@v1.2
        with:
          projectBaseDir: ${{ matrix.context }}
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Optional commercial SCA (uncomment if licences available):
      # - name: Checkmarx One
      #   uses: checkmarx/ast-github-action@main
      #   with:
      #     base_uri: ${{ secrets.CHECKMARX_BASE_URI }}
      #     cx_tenant: ${{ secrets.CHECKMARX_TENANT }}
      #     cx_client_id: ${{ secrets.CHECKMARX_CLIENT_ID }}
      #     cx_client_secret: ${{ secrets.CHECKMARX_CLIENT_SECRET }}
      #     project_name: ${{ matrix.app }}

  build-scan-push:
    name: Build -> Trivy -> Push (${{ matrix.app }})
    needs: code-quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: axion-ui
            context: axion-ui
          - app: axion-telemetry-query-service
            context: axion-telemetry-query-service
          - app: axion-ingestion-service
            context: axion-ingestion-service
          - app: axion-data-simulator
            context: axion-data-simulator
          - app: axion-database-schema
            context: axion-database-schema
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.app }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      # Build the multi-stage image locally (no push) so Trivy can scan it.
      - name: Build image (local)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          load: true
          tags: ${{ env.IMAGE_BASE }}/${{ matrix.app }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy image scan - fails the pipeline on HIGH/CRITICAL CVEs.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_BASE }}/${{ matrix.app }}:${{ steps.meta.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # Optional Prisma Cloud image scan (uncomment if licensed):
      # - name: Prisma Cloud twistcli scan
      #   env:
      #     PRISMA_API_URL: ${{ secrets.PRISMA_API_URL }}
      #     PRISMA_USERNAME: ${{ secrets.PRISMA_USERNAME }}
      #     PRISMA_PASSWORD: ${{ secrets.PRISMA_PASSWORD }}
      #   run: |
      #     curl -LOk https://downloads.paloaltonetworks.com/twistcli
      #     chmod +x twistcli
      #     ./twistcli images scan --details --address $PRISMA_API_URL -u $PRISMA_USERNAME -p $PRISMA_PASSWORD $IMAGE

      # Push only for main/tags; pull requests get build + scan only.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max