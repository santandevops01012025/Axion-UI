name: Service CI - Build, Scan & Push (reusable)

on:
  workflow_call:
    inputs:
      app:
        description: Short service name, used as the GHCR image name
        required: true
        type: string
      context:
        description: Path (from repo root) that contains the service Dockerfile
        required: true
        type: string
      push-images:
        description: Whether to push the image to GHCR (false for pull requests)
        required: false
        default: true
        type: boolean

env:
  IMAGE: ghcr.io/santandevops01012025/${{ inputs.app }}

jobs:
  build-scan-push:
    name: Build -> Trivy -> Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      # Build the multi-stage image locally (no push) so Trivy can scan it.
      - name: Build image (local)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy image scan - fails the pipeline on HIGH/CRITICAL CVEs.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # Optional Prisma Cloud image scan (uncomment if licensed):
      # - name: Prisma Cloud twistcli scan
      #   env:
      #     PRISMA_API_URL: ${{ secrets.PRISMA_API_URL }}
      #     PRISMA_USERNAME: ${{ secrets.PRISMA_USERNAME }}
      #     PRISMA_PASSWORD: ${{ secrets.PRISMA_PASSWORD }}
      #   run: |
      #     curl -LOk https://downloads.paloaltonetworks.com/twistcli
      #     chmod +x twistcli
      #     ./twistcli images scan --details --address $PRISMA_API_URL -u $PRISMA_USERNAME -p $PRISMA_PASSWORD docker.io/$IMAGE

      - name: Log in to GHCR
        if: inputs.push-images
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: inputs.push-images
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max